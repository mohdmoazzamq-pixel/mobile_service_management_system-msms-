# =====================================================================
# Nginx Reverse Proxy & Static Server Configuration
# =====================================================================

server {
    listen 80;
    server_name localhost;

    # Point Document Root directly to frontend
    root /var/www/html/frontend;
    index index.html;

    # Explicitly disable directory index browsing
    autoindex off;

    # Serve static frontend web application
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy REST API requests to backend Express server
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Serve uploaded repair images
    location /uploads/ {
        alias /var/www/html/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
