  <circle cx="32" cy="47" r="1.5" fill="#64748b"/>
  <rect x="29" y="13.5" width="6" height="1" rx="0.5" fill="#cbd5e1"/>

  <!-- Repair Tools / Wrench Overlay -->
  <g transform="translate(32, 30) rotate(-35) scale(0.7)">
    <path d="M 0 -14 C -4 -14 -7 -11 -7 -7 C -7 -4 -5 -2 -3 0 L -12 18 C -13 20 -12 23 -10 24 C -8 25 -5 24 -4 22 L 5 4 C 7 5 10 4 12 1 C 15 -2 15 -6 13 -9 L 7 -3 L 3 -7 L 9 -13 C 6 -14 3 -14 0 -14 Z" 
          fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
</svg>
