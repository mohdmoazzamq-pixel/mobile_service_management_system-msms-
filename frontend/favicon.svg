<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#brandGrad)" filter="url(#dropShadow)"/>

  <!-- Smartphone Base -->
  <rect x="18" y="12" width="28" height="40" rx="4" fill="#ffffff" opacity="0.95"/>
  <rect x="21" y="16" width="22" height="28" rx="2" fill="#1e293b"/>
