<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | Mobile Service Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="bg-light d-flex align-items-center py-5 min-vh-100">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-5">

        <div class="text-center mb-4">
          <a href="/index.html" class="navbar-brand justify-content-center text-primary fs-3 mb-2">
            <span class="brand-icon"><i class="bi bi-tools"></i></span>
            MSMS Hub
          </a>
          <h4 class="fw-bold text-dark mt-2">Reset your password</h4>
          <p class="text-muted small">Enter your registered email address and we'll send you a password reset link.</p>
        </div>

        <div class="card shadow-sm border-0 p-4">
          <div class="card-body">
            <div id="alertBox"></div>

            <form id="forgotForm">
              <div class="mb-4">
                <label for="email" class="form-label fw-semibold small">Registered Email Address <span class="text-danger">*</span></label>
                <div class="input-group">
                  <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                  <input type="email" class="form-control" id="email" required placeholder="name@example.com" autocomplete="email">
                </div>
                <div class="form-text small">We will verify your account and generate a secure password reset link.</div>
              </div>

              <button type="submit" id="submitBtn" class="btn btn-primary w-100 py-2 fw-semibold">
                <span id="btnText"><i class="bi bi-send me-1"></i>Request Password Reset</span>
                <span id="btnSpinner" class="spinner-border spinner-border-sm ms-2 d-none"></span>
              </button>
            </form>

            <div class="mt-4 pt-3 border-top text-center">
              <span class="text-muted small">Remember your password?</span>
              <a href="/login.html" class="fw-semibold text-primary ms-1 small">Sign in here</a>
            </div>

            <!-- Quick Demo Email Pills -->
            <div class="mt-4 p-3 bg-light rounded border">
              <div class="fw-bold small text-muted text-uppercase mb-2" style="font-size: 0.7rem;">Quick Fill Registered Accounts:</div>
              <div class="d-flex flex-wrap gap-2">
                <button type="button" class="btn btn-outline-dark btn-sm" onclick="quickFillEmail('john.customer@msms.local')">
                  <i class="bi bi-person me-1"></i>Customer
                </button>
                <button type="button" class="btn btn-outline-dark btn-sm" onclick="quickFillEmail('tech.alex@msms.local')">
                  <i class="bi bi-wrench me-1"></i>Technician
                </button>
                <button type="button" class="btn btn-outline-dark btn-sm" onclick="quickFillEmail('admin@msms.local')">
                  <i class="bi bi-shield-lock me-1"></i>Admin
                </button>
              </div>
            </div>

          </div>
        </div>

        <div class="text-center mt-3">
          <a href="/index.html" class="text-decoration-none text-muted small">
            <i class="bi bi-arrow-left me-1"></i>Back to home
          </a>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/router.js"></script>
  <script>
    function quickFillEmail(email) {
      document.getElementById('email').value = email;
    }

    const form = document.getElementById('forgotForm');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');
    const alertBox = document.getElementById('alertBox');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.innerHTML = '';
      submitBtn.disabled = true;
      btnSpinner.classList.remove('d-none');
      btnText.textContent = 'Verifying account...';

      const email = document.getElementById('email').value.trim();

      try {
        const res = await API.post('/auth/forgot-password', { email });
        const resetUrl = res.data && res.data.resetUrl
          ? res.data.resetUrl
          : `/reset-password.html?token=${encodeURIComponent(res.data.resetToken)}`;

        alertBox.innerHTML = `
          <div class="alert alert-success py-3 small" role="alert">
            <div class="d-flex align-items-center mb-2">
              <i class="bi bi-check-circle-fill fs-5 text-success me-2"></i>
              <strong>Password Reset Link Ready</strong>
            </div>
            <p class="mb-2">A password reset request has been generated for <strong>${email}</strong>.</p>
            <div class="p-2 bg-white rounded border mb-3 text-break font-monospace" style="font-size: 0.75rem;">
              Token: ${res.data.resetToken}
            </div>
            <a href="${resetUrl}" class="btn btn-success btn-sm w-100 fw-semibold">
              <i class="bi bi-arrow-right-circle me-1"></i>Proceed to Set New Password
            </a>
          </div>
        `;
        UI.showToast('Reset link generated successfully!', 'success');
        submitBtn.disabled = false;
        btnSpinner.classList.add('d-none');
        btnText.innerHTML = '<i class="bi bi-send me-1"></i>Resend Request';
      } catch (err) {
        alertBox.innerHTML = `
          <div class="alert alert-danger py-2 small d-flex align-items-center" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
            <div>${err.message || 'Unable to process password reset request. Please check your email.'}</div>
          </div>
        `;
        submitBtn.disabled = false;
        btnSpinner.classList.add('d-none');
        btnText.innerHTML = '<i class="bi bi-send me-1"></i>Request Password Reset';
      }
    });
  </script>
</body>
</html>
