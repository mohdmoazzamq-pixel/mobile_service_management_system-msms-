<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Registration | Mobile Service Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" href="/favicon.ico">
</head>
<body class="bg-light py-5">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-9 col-lg-6">

        <div class="text-center mb-4">
          <a href="/index.html" class="navbar-brand justify-content-center text-primary fs-3 mb-2">
            <span class="brand-icon"><i class="bi bi-tools"></i></span>
            MSMS Hub
          </a>
          <h4 class="fw-bold text-dark mt-2">Create Customer Account</h4>
          <p class="text-muted small">Register your devices and manage repairs online</p>
        </div>

        <div class="card shadow-sm border-0 p-4">
          <div class="card-body">
            <div id="alertBox"></div>

            <form id="registerForm">
              <div class="row g-3">
                <div class="col-12">
                  <label for="name" class="form-label fw-semibold small">Full Name <span class="text-danger">*</span></label>
                  <input type="text" class="form-control" id="name" required placeholder="John Doe">
                </div>

                <div class="col-md-6">
                  <label for="email" class="form-label fw-semibold small">Email Address <span class="text-danger">*</span></label>
                  <input type="email" class="form-control" id="email" required placeholder="john@example.com">
                </div>

                <div class="col-md-6">
                  <label for="phone" class="form-label fw-semibold small">Phone Number</label>
                  <input type="tel" class="form-control" id="phone" placeholder="9876543210">
                </div>

                <div class="col-12">
                  <label for="password" class="form-label fw-semibold small">Password <span class="text-danger">*</span></label>
                  <input type="password" class="form-control" id="password" required minlength="6" placeholder="At least 6 characters">
                </div>

                <div class="col-12">
                  <label for="address" class="form-label fw-semibold small">Street Address</label>
                  <input type="text" class="form-control" id="address" placeholder="123 Tech Park Ave">
                </div>

                <div class="col-12">
                  <label for="city" class="form-label fw-semibold small">City</label>
                  <input type="text" class="form-control" id="city" placeholder="Metro City">
                </div>

                <div class="col-12 mt-4">
                  <button type="submit" id="submitBtn" class="btn btn-primary w-100 py-2 fw-semibold">
                    <span id="btnText">Complete Registration</span>
                    <span id="btnSpinner" class="spinner-border spinner-border-sm ms-2 d-none"></span>
                  </button>
                </div>
              </div>
            </form>

            <div class="mt-4 pt-3 border-top text-center">
              <span class="text-muted small">Already have an account?</span>
              <a href="/login.html" class="fw-semibold text-primary ms-1 small">Sign in here</a>
            </div>

          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/router.js"></script>
  <script>
    function initRegisterPage() {
      const form = document.getElementById('registerForm');
      if (!form || form._msmsInit) return;
      form._msmsInit = true;

      const submitBtn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const btnSpinner = document.getElementById('btnSpinner');
      const alertBox = document.getElementById('alertBox');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertBox.innerHTML = '';
        submitBtn.disabled = true;
        btnSpinner.classList.remove('d-none');
        btnText.textContent = 'Registering account...';

        const payload = {
          name: document.getElementById('name').value.trim(),
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('password').value,
          phone: document.getElementById('phone').value.trim(),
          address: document.getElementById('address').value.trim(),
          city: document.getElementById('city').value.trim()
        };

        try {
          const res = await API.post('/auth/register', payload);
          API.setToken(res.data.token);
          API.setUser(res.data.user);

          UI.showToast('Account registered successfully! Redirecting...', 'success');
          setTimeout(() => {
            window.location.href = '/customer/dashboard';
          }, 800);
        } catch (err) {
          alertBox.innerHTML = `
            <div class="alert alert-danger py-2 small d-flex align-items-center" role="alert">
              <i class="bi bi-exclamation-triangle-fill me-2"></i>
              <div>${err.message || 'Registration failed'}</div>
            </div>
          `;
          submitBtn.disabled = false;
          btnSpinner.classList.add('d-none');
          btnText.textContent = 'Complete Registration';
        }
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initRegisterPage);
    } else {
      initRegisterPage();
    }
    window.addEventListener('msms:routechange', initRegisterPage);
  </script>
</body>
</html>
