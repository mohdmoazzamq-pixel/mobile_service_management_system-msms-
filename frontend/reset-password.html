<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Mobile Service Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="bg-light d-flex align-items-center py-5 min-vh-100">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-5">

        <div class="text-center mb-4">
          <a href="/index.html" class="navbar-brand justify-content-center text-primary fs-3 mb-2">
            <span class="brand-icon"><i class="bi bi-tools"></i></span>
            MSMS Hub
          </a>
          <h4 class="fw-bold text-dark mt-2">Create new password</h4>
          <p class="text-muted small">Choose a strong password with at least 6 characters.</p>
        </div>

        <div class="card shadow-sm border-0 p-4">
          <div class="card-body">
            <div id="alertBox"></div>

            <form id="resetForm">
              <!-- Reset Token -->
              <div class="mb-3">
                <label for="tokenInput" class="form-label fw-semibold small">Password Reset Token <span class="text-danger">*</span></label>
                <div class="input-group">
                  <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
                  <input type="text" class="form-control font-monospace" id="tokenInput" required placeholder="Paste reset token here">
                </div>
                <div class="form-text small" id="tokenHelp">Token is automatically detected from your reset link.</div>
              </div>

              <!-- New Password -->
              <div class="mb-3">
                <label for="newPassword" class="form-label fw-semibold small">New Password <span class="text-danger">*</span></label>
                <div class="input-group">
                  <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                  <input type="password" class="form-control" id="newPassword" required minlength="6" placeholder="At least 6 characters">
                  <button class="btn btn-outline-secondary" type="button" onclick="togglePasswordVisibility('newPassword', this)">
                    <i class="bi bi-eye"></i>
                  </button>
                </div>
              </div>

              <!-- Confirm New Password -->
              <div class="mb-4">
                <label for="confirmPassword" class="form-label fw-semibold small">Confirm New Password <span class="text-danger">*</span></label>
                <div class="input-group">
                  <span class="input-group-text bg-light"><i class="bi bi-shield-check"></i></span>
                  <input type="password" class="form-control" id="confirmPassword" required minlength="6" placeholder="Re-enter new password">
                  <button class="btn btn-outline-secondary" type="button" onclick="togglePasswordVisibility('confirmPassword', this)">
                    <i class="bi bi-eye"></i>
                  </button>
                </div>
              </div>

              <button type="submit" id="submitBtn" class="btn btn-primary w-100 py-2 fw-semibold">
                <span id="btnText"><i class="bi bi-check2-circle me-1"></i>Reset Password</span>
                <span id="btnSpinner" class="spinner-border spinner-border-sm ms-2 d-none"></span>
              </button>
            </form>

            <div class="mt-4 pt-3 border-top text-center">
              <a href="/login.html" class="fw-semibold text-primary small">
                <i class="bi bi-arrow-left me-1"></i>Return to Sign In
              </a>
            </div>

          </div>
        </div>

        <div class="text-center mt-3">
          <a href="/index.html" class="text-decoration-none text-muted small">
            <i class="bi bi-arrow-left me-1"></i>Back to home
          </a>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/router.js"></script>
  <script>
    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      const icon = btn.querySelector('i');
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('bi-eye');
        icon.classList.add('bi-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.remove('bi-eye-slash');
        icon.classList.add('bi-eye');
      }
    }

    // Auto-fill token from query parameters
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const tokenFromQuery = urlParams.get('token');
      if (tokenFromQuery) {
        document.getElementById('tokenInput').value = tokenFromQuery;
        document.getElementById('tokenHelp').textContent = 'Valid reset token loaded from URL.';
        document.getElementById('tokenHelp').classList.add('text-success');
      }
    });

    const form = document.getElementById('resetForm');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');
    const alertBox = document.getElementById('alertBox');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.innerHTML = '';

      const token = document.getElementById('tokenInput').value.trim();
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (!token) {
        alertBox.innerHTML = '<div class="alert alert-warning py-2 small">Reset token is required.</div>';
        return;
      }

      if (newPassword.length < 6) {
        alertBox.innerHTML = '<div class="alert alert-warning py-2 small">Password must be at least 6 characters long.</div>';
        return;
      }

      if (newPassword !== confirmPassword) {
        alertBox.innerHTML = '<div class="alert alert-danger py-2 small">Passwords do not match. Please re-enter carefully.</div>';
        return;
      }

      submitBtn.disabled = true;
      btnSpinner.classList.remove('d-none');
      btnText.textContent = 'Updating password...';

      try {
        await API.post('/auth/reset-password', { token, newPassword });

        alertBox.innerHTML = `
          <div class="alert alert-success py-3 small" role="alert">
            <div class="d-flex align-items-center mb-2">
              <i class="bi bi-check-circle-fill text-success fs-5 me-2"></i>
              <strong>Password Reset Successfully!</strong>
            </div>
            <p class="mb-3">Your password has been updated. You can now sign in with your new credentials.</p>
            <a href="/login.html" class="btn btn-success btn-sm w-100 fw-semibold">
              <i class="bi bi-box-arrow-in-right me-1"></i>Sign In Now
            </a>
          </div>
        `;
        UI.showToast('Password reset successfully!', 'success');
        form.classList.add('d-none');
      } catch (err) {
        alertBox.innerHTML = `
          <div class="alert alert-danger py-2 small d-flex align-items-center" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
            <div>${err.message || 'Failed to reset password. The token may be expired or invalid.'}</div>
          </div>
        `;
        submitBtn.disabled = false;
        btnSpinner.classList.add('d-none');
        btnText.innerHTML = '<i class="bi bi-check2-circle me-1"></i>Reset Password';
      }
    });
  </script>
</body>
</html>
